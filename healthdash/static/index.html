<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23256c6c'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f4;--panel:#fff;--ink:#1d2421;--ink2:#56605b;--ink3:#8a938e;--line:#e2e5e1;--line2:#eef0ed;
  --accent:#256c6c;--accent-soft:#e3f0ef;--warn:#a5521b;--warn-soft:#fbeee4;--bad:#b3261e;--bad-soft:#fbe9e7;
  --ok:#2f6b2f;--ok-soft:#e7f2e5;
  --c-enc:#2f5f9e;--c-test:#7a4fa0;--c-proc:#b3261e;--c-med:#2f7a4a;--c-img:#9c6a12;--c-fin:#6b6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141817;--panel:#1c2120;--ink:#e6ebe8;--ink2:#a9b3ae;--ink3:#77817c;--line:#2c3331;--line2:#232927;
  --accent:#6fbdbb;--accent-soft:#1f3534;--warn:#e19a62;--warn-soft:#3a2a1e;--bad:#f08a80;--bad-soft:#3a201d;
  --ok:#8fcf8a;--ok-soft:#1f3320;
  --c-enc:#79a6e0;--c-test:#bb98dc;--c-proc:#f08a80;--c-med:#7fcf98;--c-img:#e0b45c;--c-fin:#a0a0a0;
  --shadow:none;
}}
:root[data-theme=dark]{
  --bg:#141817;--panel:#1c2120;--ink:#e6ebe8;--ink2:#a9b3ae;--ink3:#77817c;--line:#2c3331;--line2:#232927;
  --accent:#6fbdbb;--accent-soft:#1f3534;--warn:#e19a62;--warn-soft:#3a2a1e;--bad:#f08a80;--bad-soft:#3a201d;
  --ok:#8fcf8a;--ok-soft:#1f3320;
  --c-enc:#79a6e0;--c-test:#bb98dc;--c-proc:#f08a80;--c-med:#7fcf98;--c-img:#e0b45c;--c-fin:#a0a0a0;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
#q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
nav{max-width:1200px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:9px 11px;border-bottom:2px solid transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav .sep{flex:1}
nav .fin{color:var(--ink3)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:600;text-align:center;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:16px 0 8px;color:var(--ink2)}
.muted{color:var(--ink3)}.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:22px;font-weight:650}
.tile span{color:var(--ink3);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
select.f{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tl-year{font-weight:650;font-size:13px;color:var(--ink3);margin:18px 0 6px;letter-spacing:.04em}
.ev{display:grid;grid-template-columns:96px 12px 1fr;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
.ev:hover{background:var(--line2)}
.ev .d{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
.ev .dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.ev .t{font-weight:550}
.ev .s{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-encounters{background:var(--c-enc)}.k-tests{background:var(--c-test)}.k-procedures{background:var(--c-proc)}
.k-medications{background:var(--c-med)}.k-imaging{background:var(--c-img)}.k-financial{background:var(--c-fin)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--line2);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--line2)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nowrap{white-space:nowrap}
.tablewrap{overflow-x:auto}
.medbars{position:relative}
.medrow{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;padding:3px 0;cursor:pointer}
.medrow .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--line2);border-radius:4px}
.seg{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--c-med);opacity:.85}
.seg.unknown-start{background:linear-gradient(90deg,transparent,var(--c-med) 30%)}
.axis{display:grid;grid-template-columns:200px 1fr;gap:10px;font-size:11px;color:var(--ink3)}
.axis .ticks{position:relative;height:16px}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.card .t{font-weight:600}
.spark{width:100%;height:70px;display:block}
.hit{padding:10px 6px;border-bottom:1px solid var(--line2);cursor:pointer}.hit:hover{background:var(--line2)}
.hit mark{background:var(--warn-soft);color:inherit;padding:0 1px;border-radius:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
dialog{border:0;border-radius:14px;padding:0;width:min(1000px,96vw);max-height:92vh;background:var(--panel);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-h h2{margin:0}
.dlg-b{padding:16px;overflow:auto;max-height:calc(92vh - 60px)}
.docview{display:grid;grid-template-columns:1fr 320px;gap:16px}
.docview iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.doctext{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:10px;border-radius:8px;max-height:70vh;overflow:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin-bottom:12px}
.kv div:nth-child(odd){color:var(--ink3)}
form.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
form.edit label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
form.edit input,form.edit textarea,form.edit select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
form.edit .wide{grid-column:1/-1}
.row-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.fin-note{font-size:13px;color:var(--ink3);margin:-4px 0 12px}
.tray{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;z-index:50}
.tray .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.15);font-size:14px}
.tray .item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray .item .st{color:var(--ink2);font-size:13px;margin-top:3px}
.tray .item.ask{border-color:var(--warn,#c80)}
.tray .item.err{border-color:var(--bad)}
.tray .item .acts{display:flex;gap:8px;margin-top:6px}
.drop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:60;color:#fff;font-size:22px;font-weight:600}
.drop.on{display:flex}
.drop div{border:3px dashed #fff;border-radius:18px;padding:40px 60px;text-align:center}
.ask-box{background:var(--bg);border-left:4px solid var(--warn,#c80);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ask-box ul{margin:6px 0 0 18px;padding:0}
@media (max-width:760px){
  .docview{grid-template-columns:1fr}
  .medrow,.axis{grid-template-columns:110px 1fr}
  .ev{grid-template-columns:78px 10px 1fr}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">__TITLE__<small id="span"></small></div>
    <input id="q" type="search" placeholder="Search everything: a test, a doctor, a medication, a word in any report…" autocomplete="off">
    <button class="btn primary" id="upl" title="Add PDFs or photos of records">＋ Add records</button>
    <input type="file" id="uplf" multiple accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,application/pdf,image/*" hidden>
    <button class="btn" id="theme" title="Light / dark">◐</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<div class="tray" id="tray" aria-live="polite"></div>
<div class="drop" id="drop"><div>Drop PDFs or photos to add them<br><span style="font-size:15px;font-weight:400">They'll be read and filed; you'll be asked about anything unclear.</span></div></div>
<dialog id="dlg"><div class="dlg-h"><div id="dlg-title"></div><button class="btn" id="dlg-close">Close</button></div><div class="dlg-b" id="dlg-body"></div></dialog>

<script>
'use strict';
const TABS = [
  ['timeline','Timeline'],['meds','Medications'],['visits','Visits'],['tests','Tests & imaging'],
  ['labs','Lab trends'],['procedures','Procedures'],['conditions','Conditions'],['providers','Doctors'],
  ['documents','Documents'],['review','Needs review'],['sep',''],['financial','Financial']
];
const KIND_LABEL = {encounters:'Visit',tests:'Test',labs:'Lab',procedures:'Procedure',medications:'Medication',
  conditions:'Condition',allergies:'Allergy',imaging:'Imaging',providers:'Doctor',financial:'Financial'};
const FIELDS = {
  encounters:['date','end_date','type','facility','provider','reason','summary'],
  tests:['date','category','name','body_part','facility','provider','result','abnormal','encounter_id'],
  labs:['date','panel','analyte','value','num','unit','ref_range','flag','facility'],
  procedures:['date','name','facility','provider','notes','encounter_id'],
  medications:['name','dose','schedule','purpose','start_date','end_date','status','prescriber','notes'],
  conditions:['name','status','first_noted','notes'],
  allergies:['substance','reaction','severity'],
  imaging:['date','modality','description','facility','location','notes'],
  providers:['name','specialty','facility','phone','notes'],
  financial:['date','kind','payee','account','description','charged','notes','encounter_id'],
};
const LONG = new Set(['summary','result','notes','description','reason']);
const S = {tab:'timeline', data:{}, filters:{kinds:new Set(['encounters','tests','procedures','medications','imaging']), year:'', fac:''}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => v == null ? '' : (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(d){ if(!d) return ''; const [y,m,dd] = d.split('-'); return [dd&&+dd, m&&MON[+m-1], y].filter(Boolean).join(' '); }
function datePlus(d){ return d ? (d.length===4? d+'-07-01' : d.length===7? d+'-15' : d) : null; }
async function api(path, opts={}){
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load(name, path, force){
  if(force || !(name in S.data)) S.data[name] = await api(path);
  return S.data[name];
}
function invalidate(){ S.data = {}; }

// ---------- theme ----------
try{ const t = localStorage.getItem('hd-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('hd-theme', next); }catch(e){}
};

// ---------- tabs & routing ----------
function renderTabs(review=0){
  $('#tabs').innerHTML = TABS.map(([id,label]) => id==='sep' ? '<span class="sep"></span>' :
    `<button data-tab="${id}" class="${S.tab===id?'on':''} ${id==='financial'?'fin':''}">${label}${id==='review'&&review?`<span class="badge">${review}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab){ S.tab = tab; location.hash = tab; $('#q').value = ''; render(); }
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if(t && t!==S.tab && TABS.some(x=>x[0]===t)){ S.tab=t; render(); } });

let qTimer;
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { $('#q').value.trim() ? renderSearch($('#q').value) : render(); }, 220); });

async function render(){
  const sum = await load('summary','/api/summary');
  renderTabs(sum.needs_review);
  $('#span').textContent = sum.first_date ? `Records ${sum.first_date.slice(0,4)} to ${sum.last_date.slice(0,4)}` : '';
  const m = $('#main');
  try{
    const fn = VIEWS[S.tab] || VIEWS.timeline;
    m.innerHTML = await fn(sum);
    bind(m);
  }catch(e){ m.innerHTML = `<div class="panel">Couldn't load: ${esc(e.message)}</div>`; }
}
function bind(root){
  root.querySelectorAll('[data-open]').forEach(el => el.onclick = ev => { ev.stopPropagation(); const [k,id] = el.dataset.open.split('|'); openRecord(k,id); });
  root.querySelectorAll('[data-doc]').forEach(el => el.onclick = ev => { ev.stopPropagation(); openDoc(el.dataset.doc); });
  root.querySelectorAll('[data-add]').forEach(el => el.onclick = () => editRecord(el.dataset.add, null));
  root.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => sortTable(th));
}
function sortTable(th){
  const tbl = th.closest('table'), idx = [...th.parentNode.children].indexOf(th);
  const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc'; th.dataset.dir = dir;
  const rows = [...tbl.tBodies[0].rows];
  rows.sort((a,b) => { const x = a.cells[idx].dataset.v ?? a.cells[idx].textContent, y = b.cells[idx].dataset.v ?? b.cells[idx].textContent;
    const nx = parseFloat(x), ny = parseFloat(y); const c = (!isNaN(nx)&&!isNaN(ny)) ? nx-ny : x.localeCompare(y); return dir==='asc'?c:-c; });
  rows.forEach(r => tbl.tBodies[0].appendChild(r));
}

// ---------- views ----------
const VIEWS = {};

VIEWS.timeline = async (sum) => {
  const ev = await load('timeline','/api/timeline');
  const c = sum.counts;
  const years = [...new Set(ev.map(e => e.date.slice(0,4)))].sort().reverse();
  const facs = [...new Set(ev.map(e => e.facility).filter(Boolean))].sort();
  const f = S.filters;
  const shown = ev.filter(e => f.kinds.has(e.kind) && (!f.year || e.date.startsWith(f.year)) && (!f.fac || e.facility===f.fac));
  let html = `<div class="tiles">
    <div class="tile"><b>${c.encounters}</b><span>visits & admissions</span></div>
    <div class="tile"><b>${c.tests + c.imaging}</b><span>tests & imaging</span></div>
    <div class="tile"><b>${c.procedures}</b><span>procedures</span></div>
    <div class="tile"><b>${sum.current_meds.length}</b><span>current medications</span></div>
    <div class="tile"><b>${c.documents}</b><span>documents</span></div>
  </div>`;
  if(sum.last_visit) html += `<div class="panel small">Most recent visit: <a href="#" data-open="encounters|${esc(sum.last_visit.id)}">${fdate(sum.last_visit.date)}, ${esc(sum.last_visit.facility||'')}: ${esc(sum.last_visit.reason||sum.last_visit.type||'')}</a></div>`;
  html += `<div class="panel"><div class="filters">` +
    [['encounters','Visits'],['tests','Tests'],['imaging','Imaging'],['procedures','Procedures'],['medications','Med changes']]
      .map(([k,l]) => `<button class="chip ${f.kinds.has(k)?'on':''}" data-kind="${k}"><span class="dot k-${k}" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px"></span>${l}</button>`).join('') +
    `<select class="f" id="f-year"><option value="">All years</option>${years.map(y=>`<option ${f.year===y?'selected':''}>${y}</option>`).join('')}</select>
     <select class="f" id="f-fac"><option value="">All places</option>${facs.map(x=>`<option ${f.fac===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
     <span class="muted small">${shown.length} events</span></div>`;
  if(!shown.length) html += '<div class="empty">Nothing matches these filters.</div>';
  let yr = '';
  for(const e of shown){
    const y = e.date.slice(0,4);
    if(y !== yr){ yr = y; html += `<div class="tl-year">${y}</div>`; }
    const range = e.end_date && e.end_date !== e.date ? ` to ${fdate(e.end_date)}` : '';
    html += `<div class="ev" data-open="${e.kind}|${esc(e.id)}"><div class="d">${fdate(e.date)}</div><div class="dot k-${e.kind}"></div>
      <div><div class="t">${esc(e.title)}${e.abnormal?'<span class="tag bad">abnormal</span>':''}${range?`<span class="tag">${esc(range.trim())}</span>`:''}</div>
      <div class="s">${e.facility?esc(e.facility)+' · ':''}${esc(e.detail||'')}</div></div></div>`;
  }
  html += '</div>';
  setTimeout(() => {
    document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { const k=b.dataset.kind; f.kinds.has(k)?f.kinds.delete(k):f.kinds.add(k); render(); });
    $('#f-year').onchange = e => { f.year = e.target.value; render(); };
    $('#f-fac').onchange = e => { f.fac = e.target.value; render(); };
  });
  return html;
};

VIEWS.meds = async () => {
  const meds = await load('medications','/api/medications');
  const al = await load('allergies','/api/allergies');
  const current = meds.filter(m => m.status==='active' || (!m.end_date && !m.status));
  const past = meds.filter(m => !current.includes(m));
  let html = `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Current medications (${current.length})</h2><button class="btn" data-add="medications">Add</button></div>
    <div class="tablewrap"><table><thead><tr><th data-sort>Medication</th><th data-sort>Dose</th><th data-sort>When</th><th data-sort>For</th><th data-sort class="hide-sm">Since</th></tr></thead><tbody>` +
    current.map(m => `<tr class="click" data-open="medications|${esc(m.id)}"><td><b>${esc(m.name)}</b></td><td>${esc(m.dose)}</td><td>${esc(m.schedule)}</td><td>${esc(m.purpose)}</td><td class="nowrap hide-sm" data-v="${esc(m.start_date||'')}">${m.start_date?fdate(m.start_date):'<span class="muted">unknown</span>'}</td></tr>`).join('') +
    `</tbody></table></div></div>`;
  // history bars
  const dated = meds.filter(m => m.start_date || m.end_date);
  if(dated.length){
    const today = new Date().toISOString().slice(0,10);
    const all = dated.flatMap(m => [m.start_date, m.end_date].filter(Boolean)).map(datePlus).concat([today]).sort();
    const t0 = new Date(all[0].slice(0,4)+'-01-01').getTime(), t1 = new Date(today).getTime() + 86400e3*30;
    const pct = d => ((new Date(datePlus(d)).getTime() - t0) / (t1 - t0) * 100);
    const byName = {};
    for(const m of dated) (byName[m.name] ||= []).push(m);
    const names = Object.keys(byName).sort((a,b) => { const sa = Math.min(...byName[a].map(m=>pct(m.start_date||m.end_date))), sb = Math.min(...byName[b].map(m=>pct(m.start_date||m.end_date))); return sa-sb; });
    const y0 = +all[0].slice(0,4), y1 = +today.slice(0,4); const step = Math.max(1, Math.ceil((y1-y0)/8));
    let ticks = ''; for(let y=y0; y<=y1; y+=step) ticks += `<span style="left:${pct(y+'-01-01')}%">${y}</span>`;
    html += `<div class="panel"><h2>Medication history</h2><p class="muted small" style="margin-top:-6px">Each bar runs from when a medication shows up as started to when it was stopped. A faded start means the records don't say when it began, only when it was first listed.</p><div class="medbars">` +
      names.map(n => `<div class="medrow" data-open="medications|${esc(byName[n][0].id)}"><div class="nm" title="${esc(n)}">${esc(n)}</div><div class="track">` +
        byName[n].map(m => { const s = m.start_date ? pct(m.start_date) : pct(m.end_date) - 3; const e = m.end_date ? pct(m.end_date) : pct(today);
          return `<div class="seg ${m.start_date?'':'unknown-start'}" style="left:${Math.max(0,s)}%;width:${Math.max(.8,e-Math.max(0,s))}%" title="${esc(m.name)} ${esc(m.dose||'')}: ${m.start_date?fdate(m.start_date):'?'} to ${m.end_date?fdate(m.end_date):'now'}"></div>`; }).join('') +
        `</div></div>`).join('') +
      `<div class="axis"><div></div><div class="ticks">${ticks}</div></div></div></div>`;
  }
  if(past.length) html += `<div class="panel"><h2>Past medications (${past.length})</h2><div class="tablewrap"><table><thead><tr><th data-sort>Medication</th><th data-sort>Dose</th><th data-sort>For</th><th data-sort>Started</th><th data-sort>Stopped</th><th class="hide-sm">Why stopped / notes</th></tr></thead><tbody>` +
    past.map(m => `<tr class="click" data-open="medications|${esc(m.id)}"><td><b>${esc(m.name)}</b></td><td>${esc(m.dose)}</td><td>${esc(m.purpose)}</td><td class="nowrap" data-v="${esc(m.start_date||'')}">${fdate(m.start_date)}</td><td class="nowrap" data-v="${esc(m.end_date||'')}">${fdate(m.end_date)}</td><td class="hide-sm small">${esc(m.notes)}</td></tr>`).join('') + `</tbody></table></div></div>`;
  html += `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Allergies</h2><button class="btn" data-add="allergies">Add</button></div>` +
    (al.length ? `<table><tbody>${al.map(a => `<tr class="click" data-open="allergies|${esc(a.id)}"><td><b>${esc(a.substance)}</b></td><td>${esc(a.reaction)}</td><td class="muted">${esc(a.severity||'')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">None recorded.</div>') + `</div>`;
  return html;
};

function recordTable(kind, rows, cols, title, opts={}){
  let html = `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${title} (${rows.length})</h2><button class="btn" data-add="${kind}">Add</button></div>`;
  if(opts.note) html += `<p class="fin-note">${opts.note}</p>`;
  if(!rows.length) return html + '<div class="empty">None yet.</div></div>';
  html += `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th data-sort class="${c[2]||''}">${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>`;
  for(const r of rows){
    html += `<tr class="click" data-open="${kind}|${esc(r.id)}">` + cols.map(([f,,cls]) => {
      let v = r[f];
      if(f.endsWith('date') || f==='date' || f==='first_noted') return `<td class="nowrap ${cls||''}" data-v="${esc(v||'')}">${fdate(v)}</td>`;
      if(f==='charged') return `<td class="num ${cls||''}" data-v="${v??''}">${money(v)}</td>`;
      if(f==='abnormal') return `<td class="${cls||''}">${v?'<span class="tag bad">abnormal</span>':''}</td>`;
      if(f==='status') return `<td class="${cls||''}"><span class="tag ${v==='active'?'warn':v==='resolved'?'ok':''}">${esc(v||'')}</span></td>`;
      return `<td class="${cls||''}">${f===cols[0][0]||f==='name'||f==='reason'?`<b>${esc(v)}</b>`:esc(v)}</td>`;
    }).join('') + `<td class="nowrap">${(r.docs||[]).length?`<span class="tag" title="has source document">📄 ${(r.docs||[]).length}</span>`:''}${r.needs_review?'<span class="tag warn">review</span>':''}</td></tr>`;
  }
  return html + '</tbody></table></div></div>';
}

function spark(pts){
  const W=260,H=70,P=6;
  const xs = pts.map(p => new Date(datePlus(p.date)).getTime());
  const ys = pts.map(p => p.num);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const rr = (pts[pts.length-1].ref_range||'').match(/(-?[\d.]+)\s*[-–]\s*(-?[\d.]+)/);
  let rl, rh; if(rr){ rl=+rr[1]; rh=+rr[2]; lo=Math.min(lo,rl); hi=Math.max(hi,rh); }
  if(hi===lo){ hi+=1; lo-=1; }
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const X = t => P + (x1===x0 ? (W-2*P)/2 : (t-x0)/(x1-x0)*(W-2*P));
  const Y = v => H-P - (v-lo)/(hi-lo)*(H-2*P);
  const band = rr ? `<rect x="0" y="${Y(rh)}" width="${W}" height="${Math.max(1,Y(rl)-Y(rh))}" fill="var(--ok-soft)"/>` : '';
  const line = pts.map((p,i) => `${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.num).toFixed(1)}`).join('');
  const dots = pts.map((p,i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.num).toFixed(1)}" r="3" fill="${p.flag?'var(--bad)':'var(--accent)'}"><title>${fdate(p.date)}: ${esc(p.value)} ${esc(p.unit||'')}</title></circle>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${band}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${dots}</svg>`;
}

async function openRecord(kind, id){
  const r = await api(`/api/${kind}/${encodeURIComponent(id)}`);
  const docs = await load('documents','/api/documents');
  const byId = Object.fromEntries(docs.map(d => [d.id,d]));
  const kv = FIELDS[kind].filter(f => r[f] != null && r[f] !== '').map(f => {
    let v = r[f];
    if(f.includes('date') || f==='first_noted') v = fdate(v);
    else if(f==='charged') v = money(v);
    else if(f==='abnormal') v = v ? 'Yes' : 'No';
    else if(f==='encounter_id') return `<div>Visit</div><div><a href="#" data-open="encounters|${esc(v)}">open the visit</a></div>`;
    return `<div>${f.replace(/_/g,' ')}</div><div style="white-space:pre-wrap">${esc(v)}</div>`;
  }).join('');
  const links = (r.docs||[]).map(d => byId[d] ? `<div class="hit" data-doc="${d}">📄 <b>${esc(byId[d].title)}</b> <span class="muted small">${fdate(byId[d].doc_date)}</span></div>` : '').join('');
  show(`<h2>${esc(r.name||r.reason||r.analyte||r.description||r.substance||r.payee||KIND_LABEL[kind])}</h2><div class="muted small">${KIND_LABEL[kind]}${r.edited?' · edited by hand':''}${r.needs_review?' · <span class="tag warn">needs review</span>':''}</div>`,
    `<div class="kv">${kv}</div>${links?'<h3>Source documents</h3>'+links:'<p class="muted small">No source document linked.</p>'}<div class="row-actions"><button class="btn" id="ed">Edit</button></div>`);
  $('#ed').onclick = () => editRecord(kind, r);
}

function editRecord(kind, r){
  const isNew = !r; r = r || {};
  const inputs = FIELDS[kind].map(f => {
    const v = r[f] ?? '';
    const type = (f.includes('date')||f==='first_noted') ? 'text" placeholder="YYYY-MM-DD' : ['charged','num'].includes(f) ? 'number" step="any' : 'text';
    if(f==='abnormal') return `<label>Abnormal<select name="${f}"><option value="0">No</option><option value="1" ${v?'selected':''}>Yes</option></select></label>`;
    if(f==='status' && kind==='medications') return `<label>Status<select name="status">${['active','stopped','as needed',''].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`;
    if(LONG.has(f)) return `<label class="wide">${f.replace(/_/g,' ')}<textarea name="${f}" rows="3">${esc(v)}</textarea></label>`;
    return `<label>${f.replace(/_/g,' ')}<input name="${f}" type="${type}" value="${esc(v)}"></label>`;
  }).join('');
  show(`<h2>${isNew?'Add':'Edit'} ${KIND_LABEL[kind].toLowerCase()}</h2>`,
    `<form class="edit" id="ef">${inputs}${r.needs_review?'<label class="wide" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" name="clear_review" checked> Mark as reviewed</label>':''}</form><div class="row-actions">${isNew?'':'<button class="btn danger" id="del">Delete</button>'}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div><p class="muted small" id="msg"></p>`);
  $('#cancel').onclick = () => isNew ? dlg.close() : openRecord(kind, r.id);
  $('#save').onclick = async () => {
    const fd = new FormData($('#ef')); const body = {};
    for(const f of FIELDS[kind]) body[f] = fd.get(f);
    if(fd.get('clear_review')) body.needs_review = 0;
    try{
      const out = isNew ? await api(`/api/${kind}`, {method:'POST', body:JSON.stringify(body)}) : await api(`/api/${kind}/${encodeURIComponent(r.id)}`, {method:'PUT', body:JSON.stringify(body)});
      invalidate(); await render(); openRecord(kind, out.id);
    }catch(e){ $('#msg').textContent = e.message; }
  };
  if(!isNew) $('#del').onclick = async () => { if(!confirm('Delete this entry? The source document is not affected.')) return; await api(`/api/${kind}/${encodeURIComponent(r.id)}`, {method:'DELETE'}); dlg.close(); invalidate(); render(); };
}

      ${d.text?`<h3>${viewable?'Text (searchable)':'Text'}${d.ocr_pages.length?' <span class="tag">read from scan, may contain errors</span>':''}</h3><div class="doctext">${esc(d.text).replace(/\f/g,'\n\n──── next page ────\n\n')}</div>`:''}
      ${!d.has_file?'<p class="muted">The file itself is not on the dashboard (too large, or a disc image). It is in the records folder.</p>':''}</div>

      ${d.has_file?`<p><a class="btn" href="/file/${d.id}?download=1">Download</a> <a class="btn" href="/file/${d.id}" target="_blank" rel="noopener">Open in new tab</a></p>`:''}
      <h3>Entries from this document</h3>${linked||'<p class="muted small">None.</p>'}
      <h3>Details</h3>${d.status==='processing'?'<div class="ask-box">Still reading this file. This can take a minute for scans.</div>':''}
      ${d.duplicate_of&&d.needs_review?`<div class="row-actions" style="justify-content:flex-start;margin:-4px 0 12px"><button class="btn" data-doc="${d.duplicate_of}">Open the one already filed</button></div>`:''}
      ${d.status==='error'?`<div class="ask-box">${esc(d.review_note||"Couldn't read this file.")}<div class="row-actions" style="justify-content:flex-start"><button class="btn primary" id="dretry">Try again</button></div></div>`:''}
      ${d.needs_review&&d.review_note?`<div class="ask-box"><b>Please check:</b><ul>${d.review_note.split('\n').map(q=>`<li>${esc(q)}</li>`).join('')}</ul><div class="small muted" style="margin-top:6px">Fix anything below that's wrong, then save.</div></div>`:''}
      <form class="edit" id="df" style="grid-template-columns:1fr">
        <label>Title<input name="title" value="${esc(d.title||'')}"></label><label>Date<input name="doc_date" value="${esc(d.doc_date||'')}" placeholder="YYYY-MM-DD"></label>
        <label>Kind<select name="category">${['hospital','office','imaging','labs','procedures','tests','eye','dental','medications','financial','legal','other'].map(c=>`<option ${c===d.category?'selected':''}>${c}</option>`).join('')}</select></label>
        <label>From<input name="facility" value="${esc(d.facility||'')}"></label>
        <label>Summary<textarea name="summary" rows="3">${esc(d.summary||'')}</textarea></label></form>
      <div class="row-actions">${(d.path||'').startsWith('Uploaded/')?'<button class="btn danger" id="ddel">Delete this upload</button>':''}<button class="btn primary" id="dsave">Save${d.needs_review?' and mark reviewed':''}</button></div><p class="muted small" id="dmsg"></p></div></div>`);
  if($('#ddel')) $('#ddel').onclick = async () => {
    if(!confirm(`Delete "${d.title}" and anything that was read from it? The original file on your computer is not affected.`)) return;
    try{ await api('/api/documents/' + id, {method:'DELETE'}); $('#dlg').close(); invalidate(); render(); }catch(e){ $('#dmsg').textContent = e.message; }
  };
  if($('#dretry')) $('#dretry').onclick = async () => {
    try{ await api('/api/documents/' + id + '/retry', {method:'POST'}); $('#dlg').close(); const t = trayItem(d.orig_path||d.title); t.status('Reading and sorting…'); watchUpload(id, t); }
    catch(e){ $('#dmsg').textContent = e.message; }
  };
  $('#dsave').onclick = async () => {
    const fd = new FormData($('#df')); const body = Object.fromEntries(fd.entries()); body.needs_review = 0; body.review_note = null;
    try{ await api('/api/documents/' + id, {method:'PUT', body:JSON.stringify(body)}); invalidate(); $('#dmsg').textContent = 'Saved.'; render(); }catch(e){ $('#dmsg').textContent = e.message; }
  };
}

// ---------- adding records ----------
$('#upl').onclick = () => HEALTH.can_read ? $('#uplf').click() : showSetupHelp();
checkHealth();
$('#uplf').onchange = e => { uploadFiles([...e.target.files]); e.target.value = ''; };
let dragN = 0;
addEventListener('dragenter', e => { if([...(e.dataTransfer?.types||[])].includes('Files')){ dragN++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if(--dragN <= 0){ dragN = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); if(e.dataTransfer?.files?.length) uploadFiles([...e.dataTransfer.files]); });

function trayItem(name){
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<div class="nm"></div><div class="st">Uploading…</div><div class="acts"></div>`;
  el.querySelector('.nm').textContent = name;
  $('#tray').prepend(el);
  return {
    status(t, cls){ el.querySelector('.st').innerHTML = t; el.className = 'item ' + (cls||''); },
    actions(html){ el.querySelector('.acts').innerHTML = html; bind(el);
      el.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => el.remove()); },
    remove(){ el.remove(); },
  };
}
let HEALTH = {can_read: true};
async function checkHealth(){
  try{ HEALTH = await api('/api/health'); }catch(e){ return; }
  const b = $('#upl');
  b.innerHTML = HEALTH.can_read ? '＋ Add records' : '＋ Add records <span title="The server can\'t read files yet">⚠</span>';
}
function showSetupHelp(){
  show('<h2>The dashboard can\'t read files yet</h2>', `<p>Files you add are saved, but the server is missing the programs that read PDFs and scans (${esc(HEALTH.missing.join(', '))}).
    Install them once on the server, and everything already added is read automatically within a minute:</p>
    <pre class="doctext">${esc(HEALTH.fix)}</pre>
    <p class="muted small">To check a new install: <code>python3 -m healthdash check</code></p>
    <div class="row-actions"><button class="btn" id="upl-anyway">Add files anyway</button><button class="btn primary" id="upl-ok">OK</button></div>`);
  $('#upl-ok').onclick = () => $('#dlg').close();
  $('#upl-anyway').onclick = () => { $('#dlg').close(); $('#uplf').click(); };
}
async function uploadFiles(files){
  for(const f of files){
    const t = trayItem(f.name);
    try{
      const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {method:'POST', body:f});
      const j = await r.json().catch(() => ({}));
      if(!r.ok) throw new Error(j.error || r.statusText);
      if(j.duplicate){
        t.status(`Already in the records as <b>${esc(j.title)}</b>.`);
        t.actions(`<button class="btn" data-doc="${j.id}">Open</button><button class="btn" data-dismiss>OK</button>`);
        continue;
      }
      t.status('Reading and sorting…');
      watchUpload(j.id, t);
    }catch(e){ t.status(esc(e.message), 'err'); t.actions('<button class="btn" data-dismiss>OK</button>'); }
  }
}
async function watchUpload(id, t){
  for(let i = 0; i < 900; i++){
    await new Promise(r => setTimeout(r, i < 10 ? 1500 : 4000));
    let d; try{ d = await api('/api/documents/' + id); }catch(e){ continue; }
    if(d.status === 'processing') continue;
    invalidate(); render();
    const what = [d.title, fdate(d.doc_date), d.facility].filter(Boolean).map(esc).join(' · ');
    const extra = d.linked.length ? ` <span class="muted">(${d.linked.length} entr${d.linked.length===1?'y':'ies'} added)</span>` : '';
    if(d.status === 'error' && !HEALTH.can_read){
      t.status("Saved. It will be read automatically once the server's PDF tools are installed.", 'ask');
      t.actions(`<button class="btn" data-dismiss>OK</button>`);
    }else if(d.status === 'error'){
      t.status(esc(d.review_note || "Couldn't read this file."), 'err');
      t.actions(`<button class="btn" data-doc="${id}">Open</button><button class="btn" data-dismiss>OK</button>`);
    }else if(d.needs_review){
      const n = (d.review_note||'').split('\n').filter(Boolean).length;
      t.status(d.duplicate_of ? `<b>Possible duplicate</b> of something already filed. Best guess: ${what}`
                              : `<b>Needs your help</b> with ${n} question${n===1?'':'s'}. Best guess: ${what}`, 'ask');
      t.actions(`<button class="btn primary" data-doc="${id}">Answer</button><button class="btn" data-dismiss>Later</button>`);
    }else{
      t.status(`Filed: ${what}${extra}`);
      t.actions(`<button class="btn" data-doc="${id}">Open</button><button class="btn" data-dismiss>OK</button>`);
    }
    return;
  }
  t.status('Still reading. Check Needs review later.');
}

const start = location.hash.slice(1);
if(TABS.some(t => t[0]===start)) S.tab = start;
render();
</script>
</body>
